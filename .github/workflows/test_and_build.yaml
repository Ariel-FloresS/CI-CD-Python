name: Test And Build

on:
    workflow_dispatch:
        inputs:
            docker_tag:
                description: Tag Used for the Dockerimage
                default: v0.0.1
                required: True

permissions:
  contents: write



jobs:

    test_and_build:

        runs-on: ubuntu-latest
        steps:

            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b 

            - name: Set up Python
              run: uv python install

            - name: Check Linting (Quality Code)
              run: uv run ruff check 

            - name: Test
              run: uv run pytest -vv

            - name: Login to Github Container Registery
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker Image
              uses: docker/build-push-action@v5
              with:
                push: true
                tags: ghcr.io/${{ github.actor}}/${{github.repository}}:${{inputs.docker_tag}}

